<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>Page not found | PetalX</title>
<meta name="description" content="That page does not exist on petalxtech.com.">

<meta name="theme-color" content="#FFFFFF">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/sections.css">

<style>
  /* No script runs on this page, so nothing here may depend on one. */
  .notfound{
    min-height:100vh;display:grid;place-items:center;
    background:var(--ink);color:#FFFFFF;text-align:center;
    padding:var(--gut);
  }
  .notfound__code{
    font-family:var(--font-display);font-size:clamp(3.5rem,11vw,7rem);
    font-weight:700;line-height:1;color:var(--blue-lt);
  }
  .notfound h1{margin-top:26px;font-size:clamp(1.6rem,3.2vw,2.4rem)}
  .notfound p{
    margin-top:20px;margin-inline:auto;max-width:44ch;
    color:rgba(255,255,255,.74);font-size:1.0625rem;line-height:1.8;
  }
  .notfound p[lang="ja"]{margin-top:10px;font-family:var(--jp);font-size:.9375rem}
  .notfound .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:38px}
  .notfound .btn-primary{background:var(--accent);color:#FFFFFF}
  .notfound .btn-primary:hover{background:var(--blue-lt)}
  .notfound .btn-ghost{color:#FFFFFF;border-color:rgba(255,255,255,.3)}
  .notfound .btn-ghost:hover{color:var(--blue-lt);border-color:var(--blue-lt);background:transparent}
  .notfound .mark{width:34px;height:34px;margin:0 auto 30px;opacity:.9}
</style>
</head>
<body>

<main class="notfound">
  <div>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <g fill="#1A56DB" fill-opacity=".9" stroke="rgba(96,150,255,.5)" stroke-width=".6">
        <path id="p404" d="M12 12C12 12 9.6 9.4 10 6.6 10.3 4.6 11.4 3.6 12 3.6c.6 0 1.7 1 2 3 .4 2.8-2 5.4-2 5.4Z"/>
        <use href="#p404" transform="rotate(72 12 12)"/>
        <use href="#p404" transform="rotate(144 12 12)"/>
        <use href="#p404" transform="rotate(216 12 12)"/>
        <use href="#p404" transform="rotate(288 12 12)"/>
      </g>
    </svg>

    <p class="notfound__code">404</p>
    <h1>This page does not exist</h1>
    <p>The link may be out of date, or the address mistyped. Everything we publish lives on the two pages below.</p>
    <p lang="ja">お探しのページは見つかりませんでした。</p>

    <div class="btns">
      <a class="btn btn-primary btn-lg" href="/">Back to PetalX</a>
      <a class="btn btn-ghost btn-lg" href="/ja/" hreflang="ja" lang="ja">日本語のページ</a>
    </div>
  </div>
</main>

</body>
</html>
